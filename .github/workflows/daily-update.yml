name: Daily AFFA Pipeline Update

on:
  schedule:
    # Runs at 13:00 UTC every day (~9am Eastern). Edit the cron string to
    # change the time. https://crontab.guru is helpful for this.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit updated files back

jobs:
  update-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run funding agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python funding_agent.py

      - name: Run partnership agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python partnership_agent.py

      - name: Build CRM
        run: python build_crm.py

      - name: Run outreach agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python outreach_agent.py

      - name: Run campaign agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python campaign_agent.py

      - name: Export leads for React UI
        run: python export_leads.py

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Sync leads to the live database
        # No-op until the PRODUCTION_DATABASE_URL secret is set (repo
        # Settings -> Secrets and variables -> Actions) — see the
        # "Deploying it live" section in README.md. Until then this env
        # var is an empty string, which backend/app/config.py treats the
        # same as unset and falls back to a throwaway local SQLite file,
        # so the step succeeds without doing anything real.
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python backend/load_data.py

      - name: Commit and push updates
        run: |
          git config user.name "AFFA Pipeline Bot"
          git config user.email "actions@github.com"
          git add funders.json partners.json docs/index.html leads.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Automated daily update: new leads + refreshed campaign page"
          git push
