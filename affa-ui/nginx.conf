server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # The React app talks to /api/* same-origin; nginx forwards it to the
    # backend container over the compose network. This is what makes the
    # frontend code work identically in Docker and in plain `npm run dev`
    # (see vite.config.js's matching dev-server proxy) without ever
    # hardcoding a backend host.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
